name: Content check

# Validates content/ and the build inputs on every pull request and on main.
# Intake pull requests (opened by the website form) get their red or green tick here.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content and build inputs
        run: npm run build:check
